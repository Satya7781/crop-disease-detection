<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#123d2e">
    <title>New scan · Smart Crop</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="upload-page">
    <header class="topbar">
        <a class="brand-logo" href="landing.html"><span class="logo-mark">✦</span> SMART CROP</a>
        <a href="index.html" id="logoutLink">Log out <span aria-hidden="true">↗</span></a>
    </header>
    <main>
        <section class="upload-panel">
            <div class="eyebrow">New analysis</div>
            <h1>What is your leaf telling you?</h1>
            <p>Upload a clear, well-lit photo and our AI will screen it for common crop diseases.</p>
            <form id="predictionForm" enctype="multipart/form-data">
                <div class="drop-zone" id="dropZone">
                    <strong>Drop your leaf photo here</strong>
                    <div>or choose an image from your device</div>
                    <input type="file" id="leafImage" name="image" accept="image/jpeg,image/png,image/webp" required>
                    <div class="preview" id="imagePreview">
                        <img id="previewImage" alt="Selected leaf preview">
                        <div><strong id="previewName"></strong><small id="previewSize"></small></div>
                    </div>
                </div>
                <button class="button scan-button" type="submit">Analyze my leaf <span aria-hidden="true">→</span></button>
                <p class="status" id="predictionStatus" role="status" aria-live="polite"></p>
            </form>
        </section>
    </main>
    <script src="script.js" defer></script>
</body>
</html>
