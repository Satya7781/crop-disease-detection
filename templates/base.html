{% load static %}
<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Smart Crop{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --ink:#17352c; --muted:#6b7d75; --green:#148b63; --mint:#e8f6ef; --cream:#f7fbf8; --line:#dcebe3; }
        * { box-sizing:border-box; }
        body { margin:0; min-height:100vh; color:var(--ink); background:linear-gradient(135deg,#f7fbf8 0%,#eef8f1 52%,#fff 100%); font-family:"DM Sans",sans-serif; }
        a { color:var(--green); text-decoration:none; }
        a:hover { text-decoration:underline; }
        .shell { max-width:1100px; margin:auto; padding:24px; }
        .nav { display:flex; align-items:center; justify-content:space-between; gap:20px; margin-bottom:44px; }
        .brand { display:flex; align-items:center; gap:10px; font-family:"Space Grotesk"; font-size:1.15rem; font-weight:700; letter-spacing:.04em; }
        .brand-mark { display:grid; place-items:center; width:38px; height:38px; border-radius:12px; color:#fff; background:var(--green); box-shadow:0 8px 20px #148b6333; }
        .nav-links { display:flex; align-items:center; gap:18px; color:var(--muted); font-size:.92rem; }
        .button { display:inline-flex; justify-content:center; align-items:center; gap:8px; border:0; border-radius:12px; padding:12px 18px; color:#fff; background:var(--green); font:600 .95rem "DM Sans"; cursor:pointer; box-shadow:0 10px 24px #148b6330; }
        .button:hover { background:#0d744f; text-decoration:none; }
        .button.secondary { color:var(--green); background:#fff; border:1px solid var(--line); box-shadow:none; }
        .card { border:1px solid #fff; border-radius:24px; background:#fff; box-shadow:0 18px 45px #275d4312; }
        .eyebrow { color:var(--green); font-size:.78rem; font-weight:700; letter-spacing:.16em; text-transform:uppercase; }
        h1,h2 { margin:0; font-family:"Space Grotesk"; letter-spacing:-.03em; }
        h1 { font-size:clamp(2rem,4vw,3.8rem); line-height:1.05; }
        h2 { font-size:1.7rem; }
        .muted { color:var(--muted); line-height:1.6; }
        .form-card { max-width:560px; margin:0 auto; padding:clamp(24px,5vw,48px); }
        .form-card header { margin-bottom:28px; }
        label { display:block; margin:18px 0 7px; font-weight:600; }
        input, select { width:100%; padding:13px 14px; border:1px solid var(--line); border-radius:11px; color:var(--ink); background:#fbfefc; font:inherit; }
        input:focus, select:focus { outline:3px solid #8ce0bb66; border-color:var(--green); }
        .errorlist { margin:7px 0; padding-left:20px; color:#b42318; font-size:.9rem; }
        .notice { margin:14px 0; padding:13px 15px; border-radius:11px; color:#9d261e; background:#fff2f0; }
        .helptext { display:block; margin-top:7px; color:var(--muted); font-size:.86rem; line-height:1.45; }
        .actions { display:flex; flex-wrap:wrap; align-items:center; gap:12px; margin-top:26px; }
        .hero { display:grid; grid-template-columns:1.1fr .9fr; gap:44px; align-items:center; margin:30px 0 54px; }
        .hero-copy p { max-width:540px; font-size:1.05rem; }
        .hero-art { min-height:330px; padding:28px; overflow:hidden; position:relative; background:linear-gradient(145deg,#175b43,#1b9b6b); }
        .hero-art:after { content:""; position:absolute; width:240px; height:240px; right:-70px; bottom:-90px; border:30px solid #ffffff25; border-radius:50%; }
        .scan { position:relative; z-index:1; display:flex; flex-direction:column; justify-content:space-between; min-height:274px; padding:24px; border:1px solid #ffffff30; border-radius:18px; color:#fff; background:#ffffff12; backdrop-filter:blur(8px); }
        .scan-icon { font-size:4rem; }
        .upload-card { padding:clamp(22px,5vw,42px); }
        .upload-grid { display:grid; grid-template-columns:1fr .8fr; gap:30px; align-items:center; }
        .file-box { padding:28px; border:1.5px dashed #9bd5bb; border-radius:18px; background:var(--cream); }
        .result { display:grid; grid-template-columns:280px 1fr; gap:32px; align-items:center; padding:30px; }
        .result img { width:100%; aspect-ratio:1; object-fit:cover; border-radius:18px; }
        .confidence { display:inline-block; margin:18px 0; padding:8px 12px; border-radius:99px; color:#087146; background:var(--mint); font-weight:700; }
        .gallery { display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:18px; margin-top:26px; }
        .gallery-card { overflow:hidden; }
        .gallery-card img { width:100%; height:190px; object-fit:cover; }
        .gallery-card .body { padding:16px; }
        footer { margin-top:70px; padding:24px 0; color:var(--muted); text-align:center; font-size:.86rem; }
        @media (max-width:760px) { .shell{padding:18px}.nav{margin-bottom:28px}.nav-links a:not(.button){display:none}.hero,.upload-grid,.result{grid-template-columns:1fr}.hero-art{min-height:250px}.result img{max-width:280px}.actions .button{width:100%} }
    </style>
</head>
<body>
    <div class="shell">
        <nav class="nav">
            <a class="brand" href="/"><span class="brand-mark">✦</span> SMART CROP</a>
            <div class="nav-links">
                <a href="{% url 'leaf_image_list' %}">My scans</a>
                <a class="button secondary" href="{% url 'account_logout' %}">Log out</a>
            </div>
        </nav>
        {% block content %}{% endblock %}
        <footer>Smart Crop · AI-assisted plant health insights</footer>
    </div>
</body>
</html>
